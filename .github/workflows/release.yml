# Tag-driven release: binaries, cosign signatures, SLSA provenance, GitHub
# Release, Homebrew tap bump.
#
# Before tagging, read the "Releasing" section in CONTRIBUTING.md. The failures
# this guards against are silent ones -- confirm the run happened rather than
# assuming a missing release means the job is still going.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# Serialize release runs against the same tag. A re-pushed tag (rare but
# possible during an emergency rebuild) shouldn't race two goreleaser
# invocations producing inconsistent Homebrew tap commits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    # GoReleaser publishes only from the PUBLIC repo (after the snapshot pushes
    # the tag there). The same tag also lands on this private dev repo, but
    # releasing is the public repo's job -- skip here (skipped = neutral).
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `environment: homebrew-tap` scopes HOMEBREW_TAP_GITHUB_TOKEN to this
    # environment instead of repo-wide, and lets us add approval/protection
    # rules without re-tagging.
    environment: homebrew-tap
    permissions:
      contents: write
      # Required for cosign keyless signing + SLSA build-provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Install cosign (keyless signer via Fulcio + Rekor)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned so a cosign release cannot change what a tag produces.
          # 3.x signs to a Sigstore bundle rather than a detached .sig, which
          # is what .goreleaser.yml now asks for.
          cosign-release: "v3.1.3"
      # Release notes come from CHANGELOG.md, not from git history. The snapshot
      # publish squashes an entire release into ONE "Release vX.Y.Z" commit on
      # the public repo, so goreleaser's git-log changelog has exactly one
      # subject to describe and produces a useless one-line body. Extract this
      # tag's section instead and hand it over as the release body.
      #
      # A missing section fails the release. A version ships with notes or it
      # does not ship.
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          awk -v want="## ${GITHUB_REF_NAME}" '
            $0 == want        { inside = 1; next }
            inside && /^## /  { exit }
            inside            { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section — add one and re-tag."
            exit 1
          fi
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
          echo "--- release notes for ${GITHUB_REF_NAME} ---"
          cat "$notes"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # SLSA build-provenance over each release binary. Independent from
      # cosign's signature (which proves who signed at release time); this
      # attestation pins WHAT was built and HOW (the workflow run).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # goreleaser writes per-build binaries to
          # dist/<build-id>_<os>_<arch>_v<variant>/<binary>. Build id + binary are
          # both "dbgorilla"; a glob is robust to the variant suffix (and future
          # id renames), so provenance still covers all four platform binaries.
          subject-path: dist/dbgorilla_*/dbgorilla

  # Publish the collector's CloudFormation template. It is versioned
  # independently of the CLI (Metadata.DBGorilla.TemplateVersion, mirrored by
  # collector.TemplateVersion), so this republishes the same key on most
  # releases and only writes a new one when the template's parameter contract
  # actually changes. The CLI deploys this file by URL with no local copy, so a
  # published version must never change underneath an already-released CLI --
  # hence the overwrite guard below.
  publish-template:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # OIDC federation into the dbgorilla-cli artifacts account
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_CFN_PUBLISH_ROLE }}
          aws-region: us-east-1
      - name: Validate the template
        run: |
          aws cloudformation validate-template \
            --template-body file://internal/collector/cloudformation/collector-fargate.yaml
      - name: Publish
        env:
          BUCKET: dbgorilla-cfn-us-east-1
          TEMPLATE: internal/collector/cloudformation/collector-fargate.yaml
        run: |
          set -euo pipefail

          # The version the template declares is the key it publishes under.
          version=$(grep -oP "TemplateVersion:\s*'\K[^']+" "$TEMPLATE")
          if [ -z "$version" ]; then
            echo "::error::the template declares no Metadata.DBGorilla.TemplateVersion"
            exit 1
          fi
          # It must match what the CLI pins, or the CLI requests a key we never wrote.
          pinned=$(grep -oP 'TemplateVersion = "\K[^"]+' internal/collector/awstemplate.go)
          if [ "$version" != "$pinned" ]; then
            echo "::error::template says $version but collector.TemplateVersion says $pinned"
            exit 1
          fi

          key="collector/fargate/${version}.yaml"
          # Refuse to change a version that is already published: released CLIs
          # deploy it by URL and would silently pick up the new content. A
          # contract change needs a TemplateVersion bump instead.
          if aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null 2>&1; then
            aws s3api get-object --bucket "$BUCKET" --key "$key" /tmp/published.yaml >/dev/null
            if ! cmp -s /tmp/published.yaml "$TEMPLATE"; then
              echo "::error::$version is already published with different content."
              echo "::error::Bump TemplateVersion in the template and awstemplate.go instead of rewriting a released version."
              diff -u /tmp/published.yaml "$TEMPLATE" || true
              exit 1
            fi
            echo "$version already published and identical -- nothing to do"
          else
            aws s3api put-object --bucket "$BUCKET" --key "$key" \
              --body "$TEMPLATE" --content-type text/yaml
            echo "published s3://$BUCKET/$key"
          fi

          # latest.yaml backs the docs and the console quick-create link. The CLI
          # never reads it -- it pins the version above.
          aws s3api put-object --bucket "$BUCKET" --key collector/fargate/latest.yaml \
            --body "$TEMPLATE" --content-type text/yaml
          echo "published s3://$BUCKET/collector/fargate/latest.yaml"

  # The same job for the gcp target's Terraform template. It is a DIRECTORY, not
  # a single file: Infrastructure Manager reads the whole published prefix, so
  # the unit that is versioned, compared and published is the directory.
  # Everything else matches publish-template above -- independent template
  # version, republished unchanged on most releases, and a published version
  # that must never change underneath an already-released CLI.
  #
  # The identity is a workload identity federation provider and a service
  # account, both named by repository variables so no project id is baked into
  # this file. The service account needs, on this bucket only:
  # storage.objects.create, storage.objects.get, storage.objects.list.
  publish-gce-template:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # OIDC federation into the project that owns the bucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_TEMPLATE_PUBLISH_PROVIDER }}
          service_account: ${{ vars.GCP_TEMPLATE_PUBLISH_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Validate the template
        env:
          DIR: internal/collector/terraform/collector-gce
        run: |
          set -euo pipefail
          terraform -chdir="$DIR" fmt -check -diff
          # init writes .terraform/ and a lock file into whatever directory it
          # runs in, and the next step publishes that directory verbatim -- so
          # type-check a throwaway copy and leave the real one untouched.
          work=$(mktemp -d)
          cp -R "$DIR/." "$work/"
          # -backend=false: nothing is ever deployed from here.
          terraform -chdir="$work" init -backend=false -input=false
          terraform -chdir="$work" validate
      - name: Publish
        env:
          BUCKET: dbgorilla-collector-templates
          DIR: internal/collector/terraform/collector-gce
        run: |
          set -euo pipefail

          # The version the template declares is the prefix it publishes under.
          version=$(grep -oP '^# template-version: \K\S+' "$DIR/main.tf" || true)
          if [ -z "$version" ]; then
            echo "::error::$DIR/main.tf declares no '# template-version: <v>' marker"
            exit 1
          fi
          # It must match what the CLI pins, or the CLI requests a prefix we never wrote.
          pinned=$(grep -oP 'GcpTemplateVersion = "\K[^"]+' internal/collector/gcptemplate.go)
          if [ "$version" != "$pinned" ]; then
            echo "::error::template says $version but collector.GcpTemplateVersion says $pinned"
            exit 1
          fi

          prefix="collector/gce/${version}"
          # Refuse to change a version that is already published: released CLIs
          # deploy it from this address and would silently pick up the new
          # content. A contract change needs a GcpTemplateVersion bump instead.
          published=$(mktemp -d)
          if gcloud storage ls "gs://$BUCKET/$prefix/**" >/dev/null 2>&1; then
            gcloud storage cp -r "gs://$BUCKET/$prefix/*" "$published/"
            # -r compares the whole directory, so a file added or removed since
            # the release counts as a difference too, not just an edited one.
            if ! diff -r "$published" "$DIR"; then
              echo "::error::$version is already published with different content."
              echo "::error::Bump GcpTemplateVersion in gcptemplate.go and the main.tf marker instead of rewriting a released version."
              exit 1
            fi
            echo "$version already published and identical -- nothing to do"
          else
            gcloud storage cp -r "$DIR/*" "gs://$BUCKET/$prefix/"
            echo "published gs://$BUCKET/$prefix/"
          fi

          # latest/ backs the docs. The CLI never reads it -- it pins the
          # version above.
          gcloud storage cp -r "$DIR/*" "gs://$BUCKET/collector/gce/latest/"
          echo "published gs://$BUCKET/collector/gce/latest/"
