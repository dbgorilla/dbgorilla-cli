name: coverage

# Unit-test coverage -> Codecov, tokenless via GitHub OIDC (id-token: write;
# no static upload secret). Coverage is an INFORMATIONAL signal here, never a
# merge gate: codecov.yml marks both project and patch statuses informational,
# with carryforward so a non-code PR never shows a false drop.
#
# fail_ci_if_error stays false on purpose: cli.codecov.io intermittently serves
# invalid OpenPGP data, which fails the action's CLI-binary signature check.
# There is no "skip verification" flag; tolerating the error still lands the
# upload.

on:
  push:
    branches: [main, "feat/**", "release-**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token codecov-action uses for tokenless upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: test with coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Upload to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          flags: cli
          name: cli-unit
          use_oidc: true
          fail_ci_if_error: false
