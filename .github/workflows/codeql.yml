name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 6am UTC

permissions:
  security-events: write
  contents: read
  # CodeQL's telemetry/cleanup steps query the workflow-runs API; without
  # `actions: read` they fail with "Resource not accessible by integration"
  # on dependabot PRs (which run with a downgraded GITHUB_TOKEN).
  actions: read

jobs:
  analyze:
    # CodeQL code scanning requires GitHub Advanced Security on PRIVATE repos.
    # This is the private dev mirror, so skip it here (a skipped job is neutral,
    # not a failure) and let CodeQL run on the public, source-available repo,
    # where code scanning is free. This workflow travels to public unchanged via
    # the publish snapshot.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
