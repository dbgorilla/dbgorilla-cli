name: test

on:
  push:
    branches: [main, "feat/**", "release-**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          # Single Go version from go.mod. Our `go` directive is explicit
          # (1.26.x) so an oldstable matrix produces "go.mod requires 1.26"
          # compile errors. Switch to a matrix once we relax the minimum.
          go-version-file: "go.mod"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build -o dbgorilla ./cmd/dbgorilla

# Coverage upload to Codecov lives in coverage.yml, not here. That is an
# org-internal concern (it uses a private shared reusable) and is stripped from
# the public source-available mirror, so it must not be part of this
# customer-facing workflow. Keeping test.yml free of any internal reference is
# what lets it ship to dbgorilla/dbgorilla-cli unchanged.
