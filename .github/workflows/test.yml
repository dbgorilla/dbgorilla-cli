name: test

on:
  push:
    branches: [main, "feat/**", "release-**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.0.0
        with:
          # Single Go version from go.mod. Our `go` directive is explicit
          # (1.26.x) so an oldstable matrix produces "go.mod requires 1.26"
          # compile errors. Switch to a matrix once we relax the minimum.
          go-version-file: "go.mod"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      # The coverage-upload reusable runs on a separate runner with no shared
      # filesystem, so the report crosses the job boundary as an artifact.
      - name: Upload coverage report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-cli
          path: coverage.out
          retention-days: 1
      - name: build
        run: go build -o dbgorilla ./cmd/dbgorilla

  # Push the report to Codecov via the shared reusable (upload-only, tokenless
  # OIDC). flag "cli" = the single component; codecov.yml marks it informational +
  # carryforward so a non-code PR never shows a false drop.
  coverage-upload:
    name: Upload coverage to Codecov
    needs: test
    if: ${{ !cancelled() }}
    # Tokenless OIDC: the reusable requests id-token: write; a caller that does not
    # grant it startup-fails the whole workflow. Job-level perms replace the
    # top-level block, so contents: read must be repeated here.
    permissions:
      contents: read
      id-token: write
    # Pinned to the dbg-shared-workflows #123 merge commit on main (coverage-upload.yml).
    uses: furiousengineering/dbg-shared-workflows/.github/workflows/coverage-upload.yml@035a6879bca4e2373031cdd983611cb1f5ae0ae8
    with:
      artifact_name: coverage-cli
      flags: cli
      name: cli-unit
    secrets: inherit
