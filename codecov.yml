# Codecov config for dbgorilla-cli (codecov-coverage-rollout).
#
# Single Go module (cmd/ + internal/). One flag, "cli". Coverage is a SIGNAL, not
# a gate: informational:true means it never blocks a PR; carryforward:true keeps
# the last-known number when a PR doesn't touch covered code.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

flags:
  cli:
    carryforward: true

ignore:
  - "**/*_test.go"
  - "scripts/**"

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false
  show_carryforward_flags: true
