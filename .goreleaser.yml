# goreleaser config for dbgorilla-cli.
#
# `goreleaser release --clean` on a tag (e.g. v0.1.0) builds cross-platform
# binaries, publishes them to GitHub Releases, and updates the Homebrew tap.
#
# The on-prem distribution path is independent: the dbgorilla backend's
# Dockerfile fetches the GitHub Release artifacts at image-build time and
# bundles them into the container. See backend repo for that wiring.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dbgorilla
    main: ./cmd/dbgorilla
    binary: dbgorilla
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dbgorilla/dbgorilla-cli/cmd.Version={{ .Version }}
      - -X github.com/dbgorilla/dbgorilla-cli/cmd.Commit={{ .ShortCommit }}
      - -X github.com/dbgorilla/dbgorilla-cli/cmd.Date={{ .Date }}

# Single-binary archives keep the on-prem download URL pattern simple:
# the backend serves /cli/dbg-{os}-{arch} directly from the unzipped artifact.
# The archive filename stays "dbg-*" so the backend + curl installer need no
# change; the binary INSIDE is installed as "dbgorilla" (with a "dbg" alias).
archives:
  - id: dbg-bare
    formats: [binary]
    name_template: "dbg-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Sign every release artifact (binaries + checksums.txt) with cosign in
# keyless mode. Cosign uses GitHub Actions OIDC to mint an ephemeral
# certificate from Fulcio and publishes the signature transparency log
# entry to Rekor. No long-lived signing keys to manage.
#
# Verify with:
#   cosign verify-blob \
#     --bundle dbg-darwin-arm64.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/dbgorilla/dbgorilla-cli/\.github/workflows/release\.yml@refs/tags/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     dbg-darwin-arm64
#
# The identity pattern is anchored and its dots escaped. cosign matches it
# unanchored, so an unanchored pattern would also accept an identity that
# merely contains this text.

# Keyless signing. Publishes a Sigstore bundle per artifact rather than a bare
# detached signature: keyless verification needs the short-lived Fulcio
# certificate that proves who signed, and a detached .sig does not carry it.
# The bundle holds the signature, the certificate and the transparency-log
# entry in one file, so cosign verify-blob works against a downloaded artifact
# on its own.
#
# `signature:` names the file GoReleaser tracks and uploads as a release
# asset, so it has to be the bundle.
signs:
  - cmd: cosign
    artifacts: all
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

snapshot:
  version_template: "{{ .Tag }}-next"

# Kept as the fallback for a local `goreleaser release` run. CI does NOT use
# this: release.yml passes --release-notes with the tag's CHANGELOG.md section,
# because the public repo receives one squashed "Release vX.Y.Z" commit per
# version and a git-log changelog has nothing to describe.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  # Overwrite assets when re-publishing an existing tag. Without this, a
  # re-tag after a failed previous run hits 422 already_exists from the
  # uploads API.
  replace_existing_artifacts: true

# Homebrew tap. Requires a tap repo at github.com/dbgorilla/homebrew-tap and
# a HOMEBREW_TAP_GITHUB_TOKEN secret in this repo's Actions settings with
# write access to that tap repo.
brews:
  - name: dbgorilla
    # A prerelease tag must not move the formula every `brew upgrade` follows.
    # The default here is to upload on every tag, so a release-candidate or a
    # tag cut to exercise this pipeline would hand Homebrew users a build that
    # was never meant for them. "auto" uploads for v1.2.3 and stays out of the
    # way for v1.2.3-rc1.
    skip_upload: "auto"
    repository:
      owner: dbgorilla
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://dbgorilla.com"
    description: "DBGorilla CLI -- sign in and connect Claude Code via MCP"
    license: "MIT"
    test: |
      system "#{bin}/dbgorilla", "version"
    # The archive is a bare binary (formats: [binary]) named dbg-{os}-{arch}.
    # Install it as "dbgorilla" (canonical) and add a "dbg" alias symlink. Ruby
    # Dir.glob because goreleaser's brew install template doesn't expose
    # per-platform asset names; the glob finds whichever dbg-* file Homebrew
    # downloaded for the current platform.
    install: |
      bin.install Dir["dbg-*"].first => "dbgorilla"
      # The raw release asset downloads without an exec bit; set it before
      # generate_completions_from_executable tries to run the binary.
      (bin/"dbgorilla").chmod 0755
      bin.install_symlink "dbgorilla" => "dbg"
      # Cobra's built-in `dbgorilla completion <shell>` already emits a valid
      # script for each shell; this Homebrew helper runs it and installs the
      # output to the right completions directory (bash/zsh/fish) so tab
      # completion works immediately after `brew install`, with no manual
      # `dbgorilla completion zsh > ...` step required.
      generate_completions_from_executable(bin/"dbgorilla", "completion")
